<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Laboratorio de Ślokas</title><link rel="stylesheet" href="../shared/styles.css"><style>.sloka-text{font-size:1.18rem;line-height:1.8;white-space:pre-line}.lab-card{max-width:850px}.source-pill{display:inline-block;background:#e6fffb;color:#075e54;border-radius:999px;padding:5px 9px;font:700 12px Arial}</style></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="eyebrow">Herramienta compartida de memorización</div><h1>Śrīla Prabhupāda Ślokas</h1><p class="lead">Bhakti Study envía únicamente la referencia normalizada. Los datos del verso y del audio se cargan desde el proyecto separado de Ślokas cuando están disponibles.</p><div id="box" class="card lab-card"><p>Cargando Laboratorio de Ślokas…</p></div></main></div><script src="../shared/app.js"></script><script>
sidebar('slokas');
const repo='https://raw.githubusercontent.com/Codecmb/srila-prabhupada-slokas/main/';
const repoPage='https://github.com/Codecmb/srila-prabhupada-slokas';
const q=new URLSearchParams(location.search),wanted=(q.get('ref')||'').trim();
const norm=s=>String(s||'').toUpperCase().replace(/[ŚĪĀṚṆṂḤṢṬḌṄÑ]/g,c=>c).replace(/[^A-Z0-9]/g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const [verses,audio]=await Promise.all([fetch(repo+'verses.json').then(r=>{if(!r.ok)throw Error('verse data');return r.json()}),fetch(repo+'audio-map.json').then(r=>r.ok?r.json():{})]);const arr=Array.isArray(verses)?verses:(verses.verses||Object.values(verses));let v=wanted?arr.find(x=>[x.reference,x.id,x.source].some(z=>norm(z)===norm(wanted))):null;if(!wanted){box.innerHTML=`<h2>Elige un śloka requerido de un área de estudio</h2><p>Abre Bhakti Śāstrī y selecciona un śloka, por ejemplo BG 2.13.</p><p><a class="button" href="../programs/bhakti-sastri/index.html">Bhakti Śāstrī</a></p>`;return}if(!v){box.innerHTML=`<span class="source-pill">Proveedor en vivo</span><h2>${esc(wanted)}</h2><p>Esta referencia no se encontró en los datos actuales del repositorio de Ślokas.</p><p><a class="button secondary" href="${repoPage}" target="_blank" rel="noopener">Abrir Repositorio de Ślokas</a></p>`;return}const ref=v.reference||v.id||wanted;let audioVal=audio[ref]||audio[v.id]||v.audio||'';if(audioVal&&typeof audioVal==='object')audioVal=audioVal.url||audioVal.src||'';if(audioVal&& !/^https?:/.test(audioVal))audioVal=repo+audioVal.replace(/^\.\//,'');box.innerHTML=`<span class="source-pill">En vivo desde el proyecto de Ślokas</span><h2>${esc(ref)}</h2>${v.title?`<h3>${esc(v.title)}</h3>`:''}${v.verse?`<div class="sloka-text">${esc(v.verse)}</div>`:''}${v.word_for_word?`<h3>Palabra por Palabra</h3><p>${esc(v.word_for_word)}</p>`:''}${v.translation?`<h3>Traducción</h3><p>${esc(v.translation)}</p>`:''}${audioVal?`<h3>Audio</h3><audio controls src="${esc(audioVal)}"></audio>`:''}<div class="action-grid"><a class="button" href="../library/reader.html?book=bg&ref=${encodeURIComponent(ref)}">Leer en el Libro Primario</a><a class="button secondary" href="${repoPage}" target="_blank" rel="noopener">Proyecto de Ślokas</a></div>`}catch(e){box.innerHTML=`<h2>${esc(wanted||'Śloka Lab')}</h2><div class="notice">No se pudieron cargar los datos del proyecto de Ślokas. La referencia del área de estudio se conserva; verifica la conexión de red o abre el proyecto separado.</div><a class="button secondary" href="${repoPage}" target="_blank" rel="noopener">Abrir Repositorio de Ślokas</a>`}})();
</script></body></html>
