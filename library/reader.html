<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lector de Libros — Bhakti Study</title><link rel="stylesheet" href="../shared/styles.css"><style>
.reader-grid{display:block}.reader-nav-bar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:1rem 0}.reader-nav-group{margin:0}.reader-nav-group summary{cursor:pointer}.reader-nav-group summary h2{display:inline;font-size:1rem;margin:0}@media(max-width:700px){.reader-nav-bar{grid-template-columns:1fr}}.chapter-list,.verse-list{max-height:68vh;overflow:auto}.chapter-btn,.verse-btn{display:block;width:100%;text-align:left;padding:10px 12px;margin:5px 0;border:1px solid #ddd8cc;background:#fff;border-radius:8px;cursor:pointer}.chapter-btn.active,.verse-btn.active{font-weight:700;border-color:#8a7650}.passage{max-width:860px}.passage h3{margin-top:1.4rem}.scripture{white-space:pre-line;font-size:1.12rem;line-height:1.8}.purport{white-space:pre-line;line-height:1.75}.reflection{width:100%;min-height:150px;padding:12px;border:1px solid #cfc7b7;border-radius:8px}.reader-actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:10px 12px;background:#f4f0e7;border-radius:8px}.muted{opacity:.72}@media(max-width:850px){.reader-grid{grid-template-columns:1fr}.chapter-list{max-height:250px}}
</style></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><a id="back" class="small" href="index.html">← Libros y Biblioteca</a><h1 id="bookTitle">Lector de Libros</h1><p id="bookMeta" class="muted"></p><div id="status" class="notice">Cargando libro…</div><div id="reader" class="reader-grid" hidden><div class="reader-nav-bar"><div class="reader-nav-group"><button id="toggleSections" class="button secondary" type="button" aria-expanded="false">Secciones ▾</button><div id="sectionsPanel" hidden><div id="chapters" class="chapter-list"></div></div></div><div class="reader-nav-group"><button id="toggleTexts" class="button secondary" type="button" aria-expanded="false">Capítulo / Textos ▾</button><div id="textsPanel" hidden><div id="sectionHeader"></div><div id="verses" class="verse-list"></div></div></div></div><div id="studyContext"></div><article id="passage" class="passage"></article></div></main></div><script src="../shared/app.js"></script><script src="../shared/student-store.js"></script><script src="../shared/highlighter.js"></script><script src="../shared/data-registry.js"></script><script src="../shared/study-context.js"></script><script src="../shared/study-return-context.js"></script><script src="../shared/source-resolver.js"></script><script src="../shared/reader.js"></script><script>
(function(){
  const sectionsButton=document.getElementById('toggleSections');
  const textsButton=document.getElementById('toggleTexts');
  const sectionsPanel=document.getElementById('sectionsPanel');
  const textsPanel=document.getElementById('textsPanel');

  function toggle(button,panel,label){
    const opening=panel.hidden;
    panel.hidden=!opening;
    button.setAttribute('aria-expanded',String(opening));
    button.textContent=label+(opening?' ▴':' ▾');
  }

  sectionsButton.addEventListener('click',function(){
    toggle(sectionsButton,sectionsPanel,'Secciones');
  });

  textsButton.addEventListener('click',function(){
    toggle(textsButton,textsPanel,'Capítulo / Textos');
  });
})();
</script></body></html>
