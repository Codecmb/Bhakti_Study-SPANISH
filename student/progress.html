<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mi Progreso</title><link rel="stylesheet" href="../shared/styles.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="eyebrow">Datos locales del estudiante</div><h1>Mi Progreso</h1><p class="lead">El progreso se deriva de los mismos registros modulares creados mientras estudias. Los libros fuente permanecen intactos.</p><section id="cards" class="grid"></section><div class="notice"><b>Privacidad:</b> Esta página no requiere una cuenta ni el nombre del estudiante. El progreso permanece en este navegador.</div></main></div><script src="../shared/app.js"></script><script src="../shared/data-registry.js"></script><script src="../shared/program-data.js"></script><script src="../shared/student-store.js"></script><script src="../shared/study-context.js"></script><script src="../shared/progress-engine.js"></script><script>
sidebar('progress');

function continueHref(programId){
  const fallback=`../programs/${programId}/index.html`;

  if(!window.StudyContext)return fallback;

  const ctx=StudyContext.read(programId);
  if(!ctx)return fallback;

  const q=new URLSearchParams();

  if(ctx.unit)q.set('unit',ctx.unit);
  if(ctx.canonical)q.set('ref',ctx.canonical);

  if(!q.toString())return fallback;

  return `../programs/${programId}/tools.html?mode=read&${q}`;
}

json('../data/programs.json').then(async ps=>{
 const rows=await Promise.all(ps.map(async p=>{let c=null;try{c=await BhaktiProgramData.loadCourse(`../programs/${p.id}/data/`)}catch(e){};return {p,c,s:c?ProgressEngine.programSummary(p.id,c.units||c.studyUnits||[],c):null}}));
 cards.innerHTML=rows.map(({p,c,s})=>{if(!s)return `<article class="card"><h3>${p.title}</h3><p class="small">Los módulos de progreso aún no están conectados para esta área de estudio.</p><a class="button secondary" href="../programs/${p.id}/index.html">Abrir área de estudio</a></article>`;return `<article class="card"><h3>${p.title}</h3>${s.completionEnabled?`<p><b>${s.complete}/${s.total}</b> unidades de la Academia completadas · <b>${s.pct}%</b></p><div class="progressbar"><i style="width:${s.pct}%"></i></div>`:`<p class="small">Las reglas de finalización de unidades de la Academia aún no están configuradas para esta área de estudio. La actividad de estudio continúa registrándose abajo.</p>`}<p class="small">${s.reading} pasajes estudiados · ${s.reflections} reflexiones sobre pasajes · ${s.notes} notas · ${s.answered} respuestas a preguntas guardadas.</p><details><summary>Detalles de la Unidad</summary>${s.units.map(u=>`<p class="small"><b>${u.complete?'✓':'○'} ${u.title}</b><br>${u.reading} pasajes · ${u.answered} respuestas a preguntas · ${u.notes} notas${u.completionEnabled?` · ${u.assessmentChecks}/${u.assessmentTotal} verificaciones de evaluación`:''}</p>`).join('')}</details><a class="button secondary" href="${continueHref(p.id)}">Continuar Estudio</a></article>`}).join('');
});
</script></body></html>
