<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Herramienta de Estudio — Bhakti Vaibhava</title><link rel="stylesheet" href="../../shared/styles.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div id="unitNav" class="study-nav"></div><div id="workflowTabs" class="tool-tabs"></div><div class="eyebrow">Espacio de Estudio</div><h1 id="heading">Bhakti Vaibhava</h1><p id="sub" class="lead"></p><div id="content" class="card tool-panel"></div></main></div><script src="../../shared/app.js"></script><script src="../../shared/data-registry.js"></script><script src="../../shared/program-data.js"></script><script src="../../shared/study-workflow.js"></script><script src="../../shared/question-provider-data.js"></script><script src="../../shared/question-engine.js"></script><script src="../../shared/question-management-ui.js"></script><script src="../../shared/vendor/jszip/jszip.min.js"></script><script src="../../shared/question-sheet-importer.js"></script><script src="../../shared/student-store.js"></script><script src="../../shared/student-work-draft.js"></script><script src="../../shared/progress-engine.js"></script><script src="../../shared/study-context.js"></script><script src="../../shared/study-return-context.js"></script><script src="../../shared/source-resolver.js"></script><script src="../../shared/student-questions.js"></script><script src="../../shared/internal-source-search.js"></script><script src="../../shared/my-questions-ui.js"></script><script src="../../shared/voice-input.js"></script><script>
sidebar('bhakti-vaibhava');
(async()=>{const q=new URLSearchParams(location.search),uid=q.get('unit')||'BV.U1',mode=q.get('mode')||'understanding',ref=q.get('ref')||'';const [course,providers]=await Promise.all([BhaktiProgramData.loadCourse('data/'),BhaktiQuestionProviders.loadProviders('data/')]),u=course.units.find(x=>x.id===uid)||course.units[0];const canonical=ref&&SourceResolver?.canon?SourceResolver.canon(ref)||ref:ref;if(!StudyWorkflow.hasMode(course,mode)){location.href=`tools.html?unit=${encodeURIComponent(uid)}&mode=understanding${canonical?'&ref='+encodeURIComponent(canonical):''}`;return}const sourceTarget=canonical?await SourceResolver.resolve(canonical):null;const sourceHref=canonical&&/^SB\./.test(canonical)?`sb.html?ref=${encodeURIComponent(canonical)}&unit=${encodeURIComponent(uid)}`:(sourceTarget?.href?sourceTarget.href+((sourceTarget.kind==='internal')?`&program=bhakti-vaibhava&unit=${encodeURIComponent(uid)}`:''):'');heading.textContent=u.title;sub.textContent='Espacio de estudio de la Academia centrado en las fuentes · '+u.id+(canonical?' · '+canonical:'');workflowTabs.innerHTML=StudyWorkflow.tabs(course,{program:'bhakti-vaibhava',unit:u.id,canonical,mode});const ix=course.units.findIndex(x=>x.id===u.id),prev=course.units[ix-1],next=course.units[ix+1];unitNav.innerHTML=`${prev?`<a class="button secondary" href="tools.html?unit=${encodeURIComponent(prev.id)}&mode=${mode}">← Volver</a>`:'<span></span>'}<a class="button secondary" href="index.html">↑ Área de Estudio</a>${next?`<a class="button secondary" href="tools.html?unit=${encodeURIComponent(next.id)}&mode=${mode}">Siguiente →</a>`:'<span></span>'}`;const scope=canonical||uid;const legacyKey='bhakti-study.bv.'+scope+'.'+mode;const studentId=`bhakti-vaibhava.${scope}.${mode}`;const save=(label='Guardado en este navegador.')=>{StudentStore.set(mode,studentId,document.querySelector('#entry')?.value||'');document.querySelector('#msg').textContent=label};
if(mode==='read'){const sources=u.sources||((u.books||[u.book]).filter(Boolean).map(book=>({book})));if(canonical&&/^SB\./.test(canonical)){location.href=`sb.html?ref=${encodeURIComponent(canonical)}&unit=${encodeURIComponent(uid)}`;return}if(canonical){const hit=await SourceResolver.resolve(canonical);if(hit?.kind==='internal'){location.href=hit.href+`&program=bhakti-vaibhava&unit=${encodeURIComponent(uid)}`;return}}if(sources.length===1&&sources[0].startRef){const src=sources[0];location.href=`../../library/reader.html?book=${encodeURIComponent(src.book)}&ref=${encodeURIComponent(src.startRef)}&program=bhakti-vaibhava&unit=${encodeURIComponent(uid)}`;return}content.innerHTML='<h2>Elegir fuente interna</h2><p class="small">Los libros de la Academia siempre se abren primero. Las fuentes externas se utilizan solo cuando no hay una fuente interna disponible.</p>'+sources.map(src=>`<p><a class="button" href="../../library/reader.html?book=${encodeURIComponent(src.book)}${src.startRef?'&ref='+encodeURIComponent(src.startRef):''}&program=bhakti-vaibhava&unit=${encodeURIComponent(uid)}">Abrir ${src.book.toUpperCase()}</a></p>`).join('');return}
if(mode==='understanding'){content.innerHTML=`<h2>Mi Comprensión</h2><p>Escribe antes de consultar material secundario. Luego vuelve al texto primario, relee la traducción y el significado de Śrīla Prabhupāda y revisa tu comprensión.</p><textarea id="entry" class="field" placeholder="¿Qué comprendo de esta unidad?"></textarea><button id="save" class="button lotus">Guardar Comprensión</button> <button id="clearWork" class="button secondary">Borrar</button> <a class="button secondary" href="${sourceHref||('tools.html?unit='+uid+'&mode=read')}"${sourceTarget?.kind==='external'?' target="_blank" rel="noopener"':''}>Estudiar las Fuentes</a><p id="msg" class="small"></p>`}
else if(mode==='notes'){content.innerHTML=`<h2>Notas</h2><p class="small">Notas privadas de estudio guardadas únicamente en este navegador.</p><textarea id="entry" class="field" placeholder="Notas, referencias y preguntas para revisar más adelante…"></textarea><button id="save" class="button">Guardar Notas</button> <button id="clearWork" class="button secondary">Borrar</button>${canonical&&sourceHref?` <a class="button secondary" href="${sourceHref}"${sourceTarget?.kind==='external'?' target="_blank" rel="noopener"':''}>Estudiar ${canonical}${sourceTarget?.kind==='external'?' ↗':''}</a>`:''}<p id="msg" class="small"></p>`}
else {const req=ProgressEngine.requirementState('bhakti-vaibhava',u,course),assessmentId=req.assessmentId,assessment=req.assessment,requirements=req.requirements;if(!req.config.enabled){content.innerHTML=`<h2>Evaluación</h2><div class="notice">Las reglas de finalización de la Academia aún no están configuradas para esta área de estudio/unidad.</div>`;return}content.innerHTML=`<h2>Evaluación</h2><div class="notice">Evaluación de autoestudio de la Academia. La evaluación oficial de BOEX permanece como un proceso separado.</div>${requirements.map((r,i)=>`<div class="check-row"><input type="checkbox" id="req${i}" data-requirement="${r.id}" ${r.checked?'checked':''}><label for="req${i}">${r.label}</label></div>`).join('')}<p><button id="saveAssessment" class="button secondary">Guardar Evaluación</button> <button id="mark" class="button saffron">Marcar Unidad de la Academia como Completada</button></p><p id="msg" class="small"></p>`;const state=()=>Object.fromEntries([...content.querySelectorAll('[data-requirement]')].map(el=>[el.dataset.requirement,el.checked]));saveAssessment.onclick=()=>{StudentStore.setJSON('assessment',assessmentId,state());msg.textContent='Evaluación guardada en este navegador.'};mark.onclick=()=>{const current=state();StudentStore.setJSON('assessment',assessmentId,current);const missing=requirements.filter(r=>!current[r.id]);if(missing.length){msg.textContent=`Completa las ${requirements.length} verificaciones configuradas de la Academia antes de marcar esta unidad como completada.`;return}StudentStore.set('completion',assessmentId,'1');msg.textContent='Unidad de la Academia marcada como completada en este navegador.'};return}
const entry=document.querySelector('#entry');
if(entry){
  entry.value=StudentStore.migrate(legacyKey,mode,studentId)||'';
  const draft=globalThis.StudentWorkDraft?.attach?.({
    id:mode==='notes'?`notes.${studentId}`:studentId,
    field:entry,
    status:document.querySelector('#msg'),
    onSave:value=>StudentStore.set(mode,studentId,value)
  });
  document.querySelector('#save')?.addEventListener('click',()=>draft?draft.save():save());

  document.querySelector('#clearWork')?.addEventListener('click',()=>{
    if(!globalThis.StudentWorkDraft?.clearWork)return;

    StudentWorkDraft.clearWork({
      id:mode==='notes'?`notes.${studentId}`:studentId,
      field:entry,
      status:document.querySelector('#msg'),
      onClear:()=>StudentStore.remove(mode,studentId),
      message:mode==='notes'
        ? '¿Borrar estas notas? Esta acción no se puede deshacer.'
        : '¿Borrar Mi Comprensión? Esta acción no se puede deshacer.'
    });
  });
}
VoiceInput?.attachAll(content);})();
</script></body></html>
