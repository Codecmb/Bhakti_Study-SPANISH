<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Śrīmad-Bhāgavatam Cantos 1–6 — Bhakti Study</title><link rel="stylesheet" href="../../shared/styles.css"><style>
.sb-grid{display:grid;grid-template-columns:280px 1fr;gap:20px}.canto-menu,.chapter-menu,.verse-menu{display:flex;gap:7px;flex-wrap:wrap}.canto-menu button,.chapter-menu button,.verse-menu button{border:1px solid #d8d0c2;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.canto-menu button.active,.chapter-menu button.active,.verse-menu button.active{font-weight:700;border-color:#f59e0b}.verse-card{max-width:900px}.verse-card h3{margin-top:1.5rem}.scripture{white-space:pre-line;font-size:1.12rem;line-height:1.8}.source-text{white-space:pre-line;line-height:1.75}.sb-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin:12px 0}.missing{padding:12px;background:#fff4df;border-radius:8px}.reader-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:850px){.sb-grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="../../shared/reader-navigation.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="eyebrow">Bhakti Vaibhava · Fuente Primaria Interna</div><h1>Śrīmad-Bhāgavatam — Cantos 1–6</h1><p class="lead">Lector autónomo de la Academia. Elige un canto, capítulo y verso. Cada pasaje se resuelve mediante la fuente canónica interna del Śrīmad-Bhāgavatam.</p><div class="card"><div id="cantos" class="canto-menu"></div><div id="chapters" class="chapter-menu" style="margin-top:10px"></div></div><div class="sb-grid"><section class="card"><h2 id="chapterTitle">Capítulo</h2><div id="verses" class="verse-menu"></div></section><section><div id="status" class="card">Cargando Śrīmad-Bhāgavatam interno…</div><article id="passage" class="card verse-card" hidden></article></section></div></main></div><script src="../../shared/app.js"></script><script src="../../shared/student-store.js"></script><script src="../../shared/highlighter.js"></script><script src="../../shared/study-return-context.js"></script><script src="../../shared/voice-input.js"></script><script>
sidebar('bhakti-vaibhava');
const $=id=>document.getElementById(id),cleanText=s=>String(s??'').replace(/\\n/g,'\n'),esc=s=>cleanText(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data,currentCanto=1,currentChapter=1,currentVerse=1;
function canonical(c,ch,v){return `SB.${c}.${ch}.${v}`}
function unitFor(c,ch){
  if(c===1)return ch<=9?{id:'BV.U1',label:'Canto 1 · Capítulos 1–9'}:{id:'BV.U2',label:'Canto 1 · Capítulos 10–19'};
  if(c===2)return {id:'BV.U3',label:'Canto 2'};
  if(c===3)return ch<=19?{id:'BV.U4',label:'Canto 3 · Capítulos 1–19'}:{id:'BV.U5',label:'Canto 3 · Capítulos 20–33'};
  if(c===4)return ch<=11?{id:'BV.U6',label:'Canto 4 · Capítulos 1–11'}:{id:'BV.U7',label:'Canto 4 · Capítulos 12–31'};
  if(c===5)return {id:'BV.U8',label:'Canto 5'};
  return {id:'BV.U9',label:'Canto 6'};
}
function external(ref){const m=ref.match(/^SB\.(\d+)\.(\d+)\.(\d+)$/);return m?`https://vedabase.io/en/library/sb/${m[1]}/${m[2]}/${m[3]}/`:''}
function vanipedia(ref){const m=ref.match(/^SB\.(\d+)\.(\d+)\.(\d+)$/);return m?`https://vanipedia.org/wiki/SB_${m[1]}.${m[2]}.${m[3]}`:''}
function chapterFor(c,ch){return data[c]?.chapters.find(x=>x.chapter===ch)||null}
function refRange(r){const x=String(r.reference||'');const m=x.match(/^(\d+)\.(\d+)\.(\d+)(?:-(\d+))?$/);return m?{c:+m[1],ch:+m[2],a:+m[3],b:+(m[4]||m[3])}:null}
function recordFor(c,ch,v){const cc=chapterFor(c,ch);if(!cc)return null;return cc.verses.find(r=>{const x=refRange(r);return x&&x.c===c&&x.ch===ch&&v>=x.a&&v<=x.b})||null}
function verseMax(c,ch){const cc=chapterFor(c,ch);return Math.max(0,...cc.verses.map(r=>{const x=refRange(r);return x?x.b:0}))}
function renderCantos(){cantos.innerHTML=[1,2,3,4,5,6].map(c=>`<button data-c="${c}" class="${c===currentCanto?'active':''}">Canto ${c}</button>`).join('');cantos.onclick=e=>{const b=e.target.closest('[data-c]');if(b)open(+b.dataset.c,1,1)}}
function renderChapters(c){const list=data[c]?.chapters||[];chapters.innerHTML=list.map(x=>`<button data-ch="${x.chapter}" class="${x.chapter===currentChapter?'active':''}">Capítulo ${x.chapter}</button>`).join('');chapters.onclick=e=>{const b=e.target.closest('[data-ch]');if(b)open(c,+b.dataset.ch,1)}}
function renderVerseMenu(c,ch){const cc=chapterFor(c,ch);chapterTitle.textContent=cc?.title||`Capítulo ${ch}`;const max=verseMax(c,ch);verses.innerHTML=Array.from({length:max},(_,i)=>i+1).map(v=>`<button data-v="${v}" class="${v===currentVerse?'active':''}">${v}</button>`).join('');verses.onclick=e=>{const b=e.target.closest('[data-v]');if(b)open(c,ch,+b.dataset.v)}}
function adjacent(c,ch,v,delta){let C=c,H=ch,V=v+delta;while(C>=1&&C<=6){const chapters=data[C]?.chapters||[];while(H>=1&&H<=chapters.length){const max=verseMax(C,H);if(V>=1&&V<=max)return[C,H,V];if(delta>0){H++;V=1}else{H--;if(H>=1)V=verseMax(C,H)}}if(delta>0){C++;H=1;V=1}else{C--;if(C>=1){H=data[C].chapters.length;V=verseMax(C,H)}}}return null}
function returnToQuestion(){
  const ctx=window.StudyReturnContext?.get?.('bhakti-vaibhava');
  if(!ctx?.returnHref)return '';
  return `<a class="button lotus" href="${esc(ctx.returnHref)}">← Volver al Banco de Preguntas</a>`;
}
function open(c,ch,v){currentCanto=c;currentChapter=ch;currentVerse=v;renderCantos();renderChapters(c);renderVerseMenu(c,ch);const r=recordFor(c,ch,v),ref=canonical(c,ch,v),unit=unitFor(c,ch);status.hidden=true;passage.hidden=false;if(!r){passage.innerHTML=`<div class="missing"><strong>${ref}</strong> no está mapeado en la fuente canónica interna del Śrīmad-Bhāgavatam.</div>`;return}const prev=adjacent(c,ch,v,-1),next=adjacent(c,ch,v,1),ved=external(ref),vani=vanipedia(ref),rr=refRange(r);passage.innerHTML=`<div class="sb-nav"><span>${prev?`<button id="prev" class="button secondary">← ${canonical(...prev)}</button>`:''}</span><span>${returnToQuestion()} <a class="button secondary" href="index.html#${unit.id}">Volver a la Unidad ${esc(unit.label)}</a> <a class="button secondary" href="index.html">Bhakti Vaibhava</a> <a class="button secondary" href="../../index.html">Menú Principal / Inicio de la Academia</a></span><span>${next?`<button id="next" class="button secondary">${canonical(...next)} →</button>`:''}</span></div><div class="eyebrow">Fuente Interna de la Academia</div><h2>${ref}${rr&&rr.a!==rr.b?` <span class="small muted">(registro fuente ${esc(r.reference)})</span>`:''}</h2><div class="reader-actions" style="margin:10px 0 18px"><a class="button lotus" href="tools.html?unit=${encodeURIComponent(unit.id)}&mode=understanding&ref=${encodeURIComponent(ref)}">Estudiar</a><a class="button secondary" href="${ved}" target="_blank" rel="noopener">Vedabase ↗</a><a class="button secondary" href="${vani}" target="_blank" rel="noopener">Vanipedia ↗</a></div><h3>Devanāgarī</h3><div class="scripture">${esc(r.devanagari||'')}</div><h3>Transliteración Romana</h3><div class="scripture">${esc(r.transliteration||'')}</div><h3>Palabra por Palabra</h3><div class="source-text">${esc(r.synonyms||'').replace(/\n/g,' ')}</div><h3>Traducción</h3><div class="source-text">${esc(r.translation||'')}</div>${r.purport?`<h3>Significado de Śrīla Prabhupāda</h3><div class="source-text">${esc(r.purport).replace(/\n/g,' ')}</div>`:`<div class="missing"><strong>Significado:</strong> este registro fuente no contiene texto de significado. No se ha inventado ningún contenido.</div>`}`;if(window.AcademyHighlighter)AcademyHighlighter.attach(passage,ref);document.getElementById('prev')?.addEventListener('click',()=>open(...prev));document.getElementById('next')?.addEventListener('click',()=>open(...next));history.replaceState(null,'',`sb.html?ref=${encodeURIComponent(ref)}&unit=${encodeURIComponent(unit.id)}`);window.scrollTo({top:0,behavior:'instant'})}
fetch('../../data/books.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`Registro de libros: HTTP ${r.status}`);return r.json()}).then(catalog=>Promise.all([1,2,3,4,5,6].map(c=>{const meta=catalog.find(b=>b.id===`sb${c}`);if(!meta?.dataPath)throw Error(`No se encontró la fuente canónica para SB Canto ${c}`);return fetch(`../../${meta.dataPath}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`Canto ${c}: HTTP ${r.status}`);return r.json()}).then(d=>[c,d])}))).then(rows=>{data={};for(const[c,d]of rows)data[c]={chapters:(d.sections||[]).filter(section=>(section.verses||[]).some(v=>/^\d+\.\d+\.\d+(?:-\d+)?$/.test(v.reference||''))).map((section,index)=>({chapter:index+1,title:section.title,verses:section.verses||[]}))};const q=new URLSearchParams(location.search),m=(q.get('ref')||'SB.1.1.1').match(/^SB[. ](\d+)[. ](\d+)[. ](\d+)(?:-(\d+))?$/i);const c=m?+m[1]:1,ch=m?+m[2]:1,v=m?+m[3]:1;if(c<1||c>6||!chapterFor(c,ch))throw Error('Este lector admite los Cantos 1–6 del Śrīmad-Bhāgavatam.');open(c,ch,v)}).catch(e=>{status.textContent='No se pudieron cargar los datos internos del Śrīmad-Bhāgavatam: '+e.message});
</script><script src="../../shared/reader-navigation.js"></script></body></html>
