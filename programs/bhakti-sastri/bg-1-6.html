<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhagavad-gītā 1–6 — Bhakti Study</title><link rel="stylesheet" href="../../shared/styles.css"><style>
.bg-grid{display:grid;grid-template-columns:260px 1fr;gap:20px}.chapter-menu,.verse-menu{display:flex;gap:7px;flex-wrap:wrap}.chapter-menu button,.verse-menu button{border:1px solid #d8d0c2;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.chapter-menu button.active,.verse-menu button.active{font-weight:700;border-color:#f59e0b}.verse-card{max-width:900px}.verse-card h3{margin-top:1.5rem}.scripture{white-space:pre-line;font-size:1.12rem;line-height:1.8}.source-text{white-space:pre-line;line-height:1.75}.bg-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin:12px 0}.missing{padding:12px;background:#fff4df;border-radius:8px}@media(max-width:850px){.bg-grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="../../shared/reader-navigation.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="eyebrow">Bhakti Śāstrī · Fuente Primaria Interna</div><h1>Bhagavad-gītā Tal Como Es — Capítulos 1–18</h1><p class="lead">Lector autónomo de la Academia. Elige un capítulo y un verso. Cada verso se resuelve mediante la fuente interna del Bhagavad-gītā.</p><div class="card"><div id="chapters" class="chapter-menu"></div></div><div class="bg-grid"><section class="card"><h2 id="chapterTitle">Capítulo</h2><div id="verses" class="verse-menu"></div></section><section><div id="status" class="card">Cargando Bhagavad-gītā interno…</div><article id="passage" class="card verse-card" hidden></article></section></div></main></div><script src="../../shared/app.js"></script><script src="../../shared/student-store.js"></script><script src="../../shared/voice-input.js"></script><script>
sidebar('bhakti-sastri');
const $=id=>document.getElementById(id),cleanText=s=>String(s??'').replace(/\\n/g,'\n'),esc=s=>cleanText(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data,currentChapter=1,currentVerse=1;
function canonical(ch,v){return `BG.${ch}.${v}`}
function unitForChapter(ch){
  if(ch<=6)return {id:'BS.U1',label:'Bhagavad-gītā 1–6'};
  if(ch<=12)return {id:'BS.U2',label:'Bhagavad-gītā 7–12'};
  return {id:'BS.U3',label:'Bhagavad-gītā 13–18'};
}
function external(ref){const m=ref.match(/^BG\.(\d+)\.(\d+)$/);return m?`https://vedabase.io/en/library/bg/${m[1]}/${m[2]}/`:''}
function vanipedia(ref){const m=ref.match(/^BG\.(\d+)\.(\d+)$/);return m?`https://vanipedia.org/wiki/ES/BG_${m[1]}.${m[2]}`:''}
function recordFor(ch,v){
  const c=data.chapters.find(x=>x.chapter===ch);
  if(!c)return null;
  const target=`${ch}.${v}`;
  return c.verses.find(r=>{
    const ref=String(r.reference||'').replace(/^BG[. ]/i,'');
    if(ref===target)return true;
    const m=ref.match(/^(\d+)\.(\d+)-(\d+)$/);
    return m && +m[1]===ch && v>=+m[2] && v<=+m[3];
  })||null;
}
function renderChapters(){chapters.innerHTML=data.chapters.map(c=>`<button data-ch="${c.chapter}" class="${c.chapter===currentChapter?'active':''}">Capítulo ${c.chapter}</button>`).join('');chapters.onclick=e=>{const b=e.target.closest('[data-ch]');if(!b)return;open(+b.dataset.ch,1)}}
function renderVerseMenu(ch){const c=data.chapters.find(x=>x.chapter===ch);chapterTitle.textContent=c.title;verses.innerHTML=Array.from({length:c.verseCount},(_,i)=>i+1).map(v=>`<button data-v="${v}" class="${v===currentVerse?'active':''}">${v}</button>`).join('');verses.onclick=e=>{const b=e.target.closest('[data-v]');if(b)open(ch,+b.dataset.v)}}
function adjacent(ch,v,delta){let c=ch,n=v+delta;while(c>=1&&c<=18){const cc=data.chapters.find(x=>x.chapter===c);if(n>=1&&n<=cc.verseCount)return [c,n];if(delta>0){c++;n=1}else{c--;if(c>=1)n=data.chapters.find(x=>x.chapter===c).verseCount}}return null}
function open(ch,v){currentChapter=ch;currentVerse=v;const unit=unitForChapter(ch);renderChapters();renderVerseMenu(ch);const r=recordFor(ch,v),ref=canonical(ch,v);status.hidden=true;passage.hidden=false;if(!r){passage.innerHTML=`<div class="missing"><strong>${ref}</strong> no está mapeado en la fuente canónica interna del Bhagavad-gītā.</div>`;return}const prev=adjacent(ch,v,-1),next=adjacent(ch,v,1),ved=external(ref),vani=vanipedia(ref);passage.innerHTML=`<div class="bg-nav"><span>${prev?`<button id="prev" class="button secondary">← ${canonical(...prev)}</button>`:''}</span><span><a class="button secondary" href="index.html#${unit.id}">Volver a la Unidad ${unit.label}</a> <a class="button secondary" href="index.html">Bhakti Śāstrī</a> <a class="button secondary" href="../../index.html">Menú Principal / Inicio de la Academia</a></span><span>${next?`<button id="next" class="button secondary">${canonical(...next)} →</button>`:''}</span></div><div class="eyebrow">Fuente Interna de la Academia</div><h2>${ref}${r.verseStart!==r.verseEnd?` <span class="small muted">(registro fuente ${esc(r.reference)})</span>`:''}</h2><div class="reader-actions" style="margin:10px 0 18px"><a class="button lotus" href="tools.html?unit=${encodeURIComponent(unit.id)}&mode=understanding&ref=${encodeURIComponent(ref)}">Estudiar</a><a class="button secondary" href="${ved}" target="_blank" rel="noopener">Vedabase ↗</a><a class="button secondary" href="${vani}" target="_blank" rel="noopener">Vanipedia ↗</a></div><h3>Devanāgarī</h3><div class="scripture">${esc(r.devanagari)}</div><h3>Transliteración Romana</h3><div class="scripture">${esc(r.transliteration)}</div><h3>Palabra por Palabra</h3><div class="source-text">${esc(r.synonyms).replace(/\n/g,' ')}</div><h3>Traducción</h3><div class="source-text">${esc(r.translation)}</div>${r.purport?`<h3>Significado de Śrīla Prabhupāda</h3><div class="source-text">${esc(r.purport).replace(/\n/g,' ')}</div>`:`<div class="missing"><strong>Significado:</strong> este registro fuente no contiene texto de significado. No se ha inventado ningún contenido.</div>`}`
document.getElementById('prev')?.addEventListener('click',()=>open(...prev));document.getElementById('next')?.addEventListener('click',()=>open(...next));history.replaceState(null,'',`bg-1-6.html?ref=${encodeURIComponent(ref)}`);window.scrollTo({top:0,behavior:'instant'})}
fetch('../../library/books/bg/book.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{
data={
  chapters:(d.sections||[]).slice(0,18).map((section,index)=>({
    chapter:index+1,
    title:section.title,
    verseCount:(section.verses||[]).length,
    verses:(section.verses||[]).map(v=>({
      ...v,
      chapter:index+1,
      verse:v.reference
    }))
  }))
};const q=new URLSearchParams(location.search),m=(q.get('ref')||'BG.1.1').match(/^BG[. ](\d+)[. ](\d+)$/i);const ch=m?+m[1]:1,v=m?+m[2]:1;if(ch<1||ch>18)throw Error('Este lector admite los capítulos 1–18 del Bhagavad-gītā.');open(ch,v)}).catch(e=>{status.textContent='No se pudieron cargar los datos internos del Bhagavad-gītā: '+e.message});
</script><script src="../../shared/reader-navigation.js"></script></body></html>
